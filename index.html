<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Robert Dakouo — Liens</title>
<style>
  :root{
    --bg:#060b16;
    --bg2:#0a1428;
    --accent:#2fa8ff;
    --accent2:#7ad1ff;
    --text:#eaf4ff;
    --muted:#9fb3c8;
    --card:#0d1930;
    --card-border:rgba(80,160,255,0.35);
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    background:
      radial-gradient(circle at 50% -10%, #12275a 0%, var(--bg) 55%),
      var(--bg);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color:var(--text);
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 48px 20px 32px;
    min-height:100%;
  }
  .badge{
    width:112px;height:112px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background: linear-gradient(145deg,#0f1f40,#0a1428);
    border:2px solid var(--accent);
    box-shadow: 0 0 24px rgba(47,168,255,0.45), inset 0 0 18px rgba(47,168,255,0.25);
    margin-bottom:22px;
  }
  .badge svg{width:62px;height:62px;}
  h1{
    font-size:1.5rem;
    letter-spacing:0.06em;
    margin:0 0 4px;
    text-align:center;
    font-weight:700;
  }
  .role{
    color:var(--accent2);
    font-size:0.82rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    margin-bottom:28px;
    text-align:center;
  }
  .links{
    width:100%;
    max-width:380px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  a.linkbtn{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:14px 18px;
    text-decoration:none;
    color:var(--text);
    font-weight:600;
    font-size:1rem;
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  a.linkbtn:hover{
    transform:translateY(-2px);
    border-color:var(--accent);
    box-shadow:0 6px 18px rgba(47,168,255,0.25);
  }
  .icon{
    width:30px;height:30px;flex:0 0 30px;
    display:flex;align-items:center;justify-content:center;
    border-radius:8px;
    background:rgba(47,168,255,0.12);
  }
  .icon svg{width:18px;height:18px;}
  .sub{
    color:var(--muted);
    font-size:0.78rem;
    margin-top:2px;
  }
  footer{
    margin-top:40px;
    text-align:center;
    color:var(--muted);
    font-size:0.78rem;
    line-height:1.6;
  }
  .tagline{
    margin-top:6px;
    color:var(--accent2);
    letter-spacing:0.08em;
    font-size:0.7rem;
    text-transform:uppercase;
  }
</style>
</head>
